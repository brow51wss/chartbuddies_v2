<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Heaven — Resident Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Caveat&family=Dancing+Script&family=Satisfy&family=Shadows+Into+Light&family=Homemade+Apple&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7f7; --card:#ffffff; --ink:#1c2b31; --muted:#7a8890;
    --line:#eaf0f0; --brand:#2b8878; --brand-dark:#1f6559; --brand-soft:#e9f5f2;
    --accent:#d3855c; --danger:#d15b44; --danger-soft:#fdeee9;
    --amber:#f7ebd3; --amber-ink:#8a6a2f;
    --radius:18px;
    --shadow:0 2px 12px rgba(20,45,50,.05);
    --shadow-lg:0 16px 44px rgba(20,45,50,.13);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{letter-spacing:-.01em}

  header.app{background:var(--card);color:var(--ink);padding:14px 28px;display:flex;align-items:center;
    justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header.app h1{font-size:19px;margin:0;font-weight:800;display:flex;align-items:center;gap:12px}
  header.app .logo{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
  header.app .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .whoami{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border-radius:999px;
    padding:5px 6px 5px 15px;font-size:14px;font-weight:700;color:var(--brand-dark)}
  .whoami .avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:12px}
  .btn{border:0;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;
    background:var(--brand-soft);color:var(--brand-dark);transition:.14s;line-height:1;font-family:inherit}
  .btn:hover{filter:brightness(.98);transform:translateY(-1px)}
  .btn:active{transform:none}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);background:var(--bg)}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
  .banner{background:var(--amber);color:var(--amber-ink);padding:8px 28px;font-size:13px;font-weight:700;text-align:center}
  .layout{display:flex;min-height:calc(100vh - 112px)}
  aside{width:284px;background:var(--card);border-right:1px solid var(--line);padding:20px 16px;flex-shrink:0}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:8px 8px 12px;
    display:flex;justify-content:space-between;align-items:center;font-weight:800}
  aside h2 a{color:var(--brand);cursor:pointer;font-weight:700;text-transform:none;letter-spacing:0;font-size:13px}
  .resident-item{padding:12px 14px;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:13px;margin-bottom:6px;transition:.12s}
  .resident-item:hover{background:var(--bg)}
  .resident-item.active{background:var(--brand-soft)}
  .resident-item .r-avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);
    display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
  .resident-item.active .r-avatar{background:var(--brand);color:#fff}
  .resident-item .r-text{display:flex;flex-direction:column;line-height:1.3}
  .resident-item .nm{font-weight:800}
  .resident-item .meta{font-size:13px;color:var(--muted)}
  main{flex:1;padding:28px 34px;max-width:1120px}
  .tabs{display:inline-flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;background:var(--card);padding:6px;
    border-radius:14px;box-shadow:var(--shadow)}
  .tab{padding:10px 20px;cursor:pointer;border-radius:10px;color:var(--muted);font-weight:700;transition:.12s}
  .tab:hover{color:var(--ink)}
  .tab.active{color:#fff;background:var(--brand)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;
    margin-bottom:20px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 18px;font-size:17px;font-weight:800}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:700}
  input,select,textarea{font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;
    background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  textarea{resize:vertical;min-height:80px}
  .row-actions{display:flex;gap:10px;margin-top:16px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.due{background:#fbeadf;color:var(--accent)}
  .init-badge{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;
    background:var(--brand-soft);color:var(--brand-dark);font-weight:800;font-size:12px}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:12px 16px;font-size:15px}
  .kv dt{color:var(--muted);font-weight:700}
  .kv dd{margin:0}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    padding:4px 11px;font-size:13px;font-weight:600;margin:3px 5px 3px 0}
  .allergy{background:var(--danger-soft);border-color:#f3cabf;color:var(--danger)}
  dialog{border:0;border-radius:20px;padding:0;box-shadow:var(--shadow-lg);max-width:580px;width:92vw}
  dialog::backdrop{background:rgba(18,35,40,.4)}
  .dlg-head{padding:20px 24px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px}
  .dlg-body{padding:24px;display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow:auto}
  .dlg-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .note{border-left:3px solid var(--brand);padding:6px 0 6px 16px;margin-bottom:16px}
  .note .h{font-size:13px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .vital-mini{font-size:13px;color:var(--muted)}
  /* Login screen */
  #login{position:fixed;inset:0;background:linear-gradient(155deg,#2f9082 0%,#1f6559 62%,#1a544a 100%);color:#fff;
    display:grid;place-items:center;z-index:50;padding:24px}
  #login .box{max-width:760px;width:100%;text-align:center}
  #login h1{font-size:38px;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
  #login p{opacity:.9;margin:0 0 34px;font-size:17px}
  .staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:16px}
  .staff-tile{position:relative;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:18px;
    padding:24px 14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:12px}
  .staff-tile:hover{background:rgba(255,255,255,.24);transform:translateY(-3px)}
  .staff-tile .avatar{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--brand-dark);
    display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.16)}
  .staff-tile .nm{font-weight:700;font-size:16px}
  .staff-tile.add{border-style:dashed;justify-content:center;min-height:134px;opacity:.85}
  .staff-tile.add .plus{font-size:36px;line-height:1}
  /* MAR grid */
  .mar-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;max-width:100%}
  .mar{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content}
  .mar th,.mar td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 5px;text-align:center}
  .mar tr th:last-child,.mar tr td:last-child{border-right:0}
  .mar tbody tr:last-child td{border-bottom:0}
  .mar thead th{background:#f7fafa;color:var(--muted);font-size:12px;font-weight:800;min-width:34px;position:sticky;top:0}
  .mar .medcol{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;min-width:252px;max-width:252px;padding:12px 15px}
  .mar thead .medcol{z-index:3;background:#f7fafa}
  .mar .mname{font-weight:800;font-size:15px}
  .mar .mname .dose{color:var(--brand-dark)}
  .mar .mdir{font-size:12px;color:var(--muted);margin-top:2px}
  .mar .mact{margin-top:6px}
  .mar .mact a{color:var(--brand);cursor:pointer;font-size:12px;font-weight:700;margin-right:12px}
  .mar td.mcell{cursor:pointer;min-width:36px;height:46px;line-height:1.15}
  .mar td.mcell:hover{background:var(--brand-soft)}
  .mar .today{background:#fef7ea}
  .mar thead th.today{background:var(--amber);color:var(--amber-ink)}
  .ini{display:inline-block;color:#12332d;font-size:18px;line-height:.9;cursor:pointer;padding:0 1px;white-space:nowrap}
  .ini:hover{color:var(--danger);text-decoration:line-through}
  .sig{display:inline-block;color:#12332d;font-size:20px;line-height:1;font-family:'Caveat',cursive}
  .sigkey td{vertical-align:middle}
  .allergy-strip{background:var(--danger-soft);border:1px solid #f3cabf;color:var(--danger);border-radius:12px;
    padding:10px 15px;font-weight:800;font-size:14px;margin-bottom:14px}
  /* Collapsible reference sections */
  details.ref{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fbfdfc;overflow:hidden}
  details.ref>summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:14px;color:var(--brand-dark);
    list-style:none;display:flex;align-items:center;gap:9px}
  details.ref>summary::-webkit-details-marker{display:none}
  details.ref>summary::before{content:'▸';transition:.15s;color:var(--muted);font-size:12px}
  details.ref[open]>summary::before{transform:rotate(90deg)}
  details.ref .ref-body{padding:2px 16px 18px}
  .legend{font-size:13px;color:var(--muted);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .legend b{color:var(--ink)}
  /* Today / Month toggle + Med Pass */
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--brand);color:#fff}
  .diet-strip{font-size:14px;margin:0 0 16px;color:var(--ink)}
  .diet-strip a{color:var(--brand);cursor:pointer;font-weight:700;margin-left:8px;font-size:13px}
  .statchips{display:flex;gap:12px;margin:2px 0 18px;flex-wrap:wrap}
  .statchip{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 18px;min-width:120px}
  .statchip .n{font-size:24px;font-weight:800;line-height:1.1}
  .statchip .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .statchip.g .n{color:var(--brand)} .statchip.d .n{color:var(--accent)} .statchip.m .n{color:var(--danger)}
  .section-h{font-weight:800;font-size:14px;margin:22px 0 8px;color:var(--ink)}
  .slot{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .slot:last-child{border-bottom:0}
  .slot-time{min-width:82px;font-weight:800;color:var(--brand-dark)}
  .slot-med{flex:1}
  .slot-med b{font-size:15px}
  .slot-med .slot-dir{display:block;font-size:12px;color:var(--muted)}
  .slot-actions{display:flex;gap:6px;flex-shrink:0}
  .slot-done{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .slot-done .undo{color:var(--muted);cursor:pointer;font-size:12px;font-weight:700}
  .slot-done .undo:hover{color:var(--danger)}
  .slot.past .slot-time{color:var(--danger)}
  .statusicon{font-size:15px;font-weight:700;color:var(--accent)}
  .disc{opacity:.5}
  /* Admin overlay */
  #adminView{position:fixed;inset:0;background:var(--bg);z-index:90;overflow:auto;display:none}
  #adminView.open{display:block}
  .admin-top{background:var(--card);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;
    justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
  .admin-top h2{margin:0;font-size:20px;font-weight:800}
  .admin-wrap{max-width:1000px;margin:0 auto;padding:24px 28px}
  .admin-tabs{display:inline-flex;gap:6px;background:var(--card);padding:6px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px}
  .admin-tabs button{border:0;background:transparent;padding:9px 18px;border-radius:9px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
  .admin-tabs button.on{background:var(--brand);color:#fff}
  .cg-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .cg-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .cg-head .init-badge{font-size:13px}
  .cg-head .nm{font-weight:800;font-size:16px;flex:1}
  .doc-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .doc-row:last-child{border-bottom:0}
  .doc-name{font-weight:700;min-width:170px}
  .doc-ok{color:var(--brand);font-weight:700;font-size:13px}
  .doc-warn{color:var(--danger);font-weight:800;font-size:13px}
  .doc-sub{color:var(--muted);font-size:12px;flex:1}
  .badge-dot{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;
    background:var(--danger);color:#fff;font-size:11px;font-weight:800;cursor:pointer;margin-left:6px}
  .sched-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .sched-row .day{min-width:110px;font-weight:800}
  .note-box{background:var(--amber);color:var(--amber-ink);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin:6px 0 16px}
  .tile-alert{position:absolute;top:10px;right:10px;background:var(--danger);color:#fff;border-radius:999px;
    min-width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:800}
  .reminder-banner{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;background:#fff;
    border:2px solid var(--danger);color:var(--ink);border-radius:14px;padding:12px 18px;box-shadow:var(--shadow-lg);
    font-size:14px;display:flex;align-items:center;gap:12px;max-width:92vw}
  .phrase-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .phrase{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font:inherit;
    font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .phrase:hover{background:var(--brand-soft);border-color:var(--brand)}
  .phrase.add{color:var(--brand);border-style:dashed}
  /* Print / inspector view */
  #printView{position:fixed;inset:0;background:#fff;color:#000;z-index:100;overflow:auto;display:none}
  #printView.open{display:block}
  .print-toolbar{position:sticky;top:0;background:#eef3f3;border-bottom:1px solid #cdd;padding:12px 20px;
    display:flex;gap:10px;align-items:center;justify-content:space-between}
  .print-sheet{padding:22px 26px;max-width:1120px;margin:0 auto}
  .print-h1{font-size:19px;font-weight:800;margin:0}
  .print-meta{font-size:13px;color:#222;margin:5px 0 2px}
  .p-allergy{color:#b00020;font-weight:800}
  .ptable{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  .ptable th,.ptable td{border:1px solid #888;padding:4px 5px;text-align:center;vertical-align:top}
  .ptable th{background:#f0f2f2}
  .ptable .l{text-align:left}
  .print-sig{font-family:'Caveat',cursive;font-size:17px;color:#111}
  @media(max-width:760px){.layout{flex-direction:column}aside{width:auto}.grid2{grid-template-columns:1fr}main{padding:20px}}
  @media print{
    body>*{display:none !important}
    #printView{display:block !important;position:static;overflow:visible}
    #printView .noprint{display:none !important}
    .print-sheet{max-width:none;padding:0}
    @page{margin:12mm}
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login">
  <div class="box">
    <h1>Little Heaven</h1>
    <p>Tap your profile to sign in. Everything you record will be stamped with your initials.</p>
    <div class="staff-grid" id="staffGrid"></div>
    <div id="lastSignedFoot" style="margin-top:26px;opacity:.85;font-size:14px"></div>
  </div>
</div>

<!-- MAIN APP (hidden until login) -->
<div id="appWrap" style="display:none">
<header class="app">
  <h1><span class="logo" onclick="logout()" style="cursor:pointer" title="Back to sign-in">LH</span> Resident Records</h1>
  <div class="tools">
    <div class="whoami"><span class="avatar" id="meAvatar"></span><span id="meName"></span>
      <span id="meDocAlert"></span>
      <button class="btn ghost sm" onclick="logout()">Switch user</button></div>
    <button class="btn ghost sm" onclick="openAdmin()">⚙ Admin</button>
    <button class="btn primary sm" onclick="openResidentDialog()">+ Add resident</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
  </div>
</header>

<div class="layout">
  <aside>
    <h2>Residents</h2>
    <div id="residentList"></div>
  </aside>
  <main id="main"></main>
</div>
</div>

<!-- Inspector print view -->
<div id="printView"></div>
<!-- Admin overlay -->
<div id="adminView"></div>

<!-- Resident dialog -->
<dialog id="residentDialog">
  <form method="dialog" onsubmit="saveResident(event)">
    <div class="dlg-head" id="resDlgTitle">Add resident</div>
    <div class="dlg-body">
      <div class="grid2">
        <label class="f">Full name<input id="r_name" required></label>
        <label class="f">Date of birth<input id="r_dob" type="date"></label>
      </div>
      <div class="grid2">
        <label class="f">Room<input id="r_room"></label>
        <label class="f">Primary physician<input id="r_physician"></label>
      </div>
      <div class="grid2">
        <label class="f">Emergency contact<input id="r_contact"></label>
        <label class="f">Contact phone<input id="r_phone"></label>
      </div>
      <label class="f">Allergies (comma separated)<input id="r_allergies" placeholder="Penicillin, latex"></label>
      <label class="f">Diagnoses (comma separated)<input id="r_diagnoses" placeholder="Type 2 diabetes, hypertension"></label>
      <label class="f">Insurance / Medicaid ID<input id="r_insurance"></label>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" onclick="residentDialog.close()">Cancel</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<!-- Generic dialog -->
<dialog id="genDialog">
  <form method="dialog" onsubmit="genSave(event)">
    <div class="dlg-head" id="genTitle">Add</div>
    <div class="dlg-body" id="genBody"></div>
    <div class="dlg-foot">
      <button type="button" class="btn" onclick="genDialog.close()">Cancel</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<!-- Staff management dialog -->
<dialog id="staffDialog">
  <div class="dlg-head">Manage caregivers</div>
  <div class="dlg-body">
    <div id="staffMgrList"></div>
    <hr style="border:0;border-top:1px solid var(--line)">
    <strong style="font-size:14px">Add caregiver</strong>
    <div class="grid2">
      <label class="f">Name<input id="s_name"></label>
      <label class="f">Initials<input id="s_initials" maxlength="4" placeholder="e.g. AB"></label>
    </div>
    <button class="btn primary sm" style="align-self:flex-start" onclick="addStaff()">Add</button>
  </div>
  <div class="dlg-foot"><button class="btn" onclick="staffDialog.close()">Done</button></div>
</dialog>

<script>
/* ---------------- Data layer ---------------- */
const KEY = 'littleHeavenRecords';           // stable — never version-bump again
const SCHEMA = 2;                            // internal data version; bump only with a migration below
const LEGACY = ['littleHeavenRecords_v5','littleHeavenRecords_v4','littleHeavenRecords_v3','littleHeavenRecords_v2','littleHeavenRecords_v1'];
let DB = load();
let currentId = null;
let currentTab = 'profile';
let me = null; // logged-in caregiver
let marMonth = new Date().getMonth();
let marYear = new Date().getFullYear();
let marView = 'today';
try{ marView = localStorage.getItem('lh_marview') || 'today'; }catch(e){}

function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if(!raw){ for(const k of LEGACY){ const r=localStorage.getItem(k); if(r){ raw=r; break; } } } // recover pre-upgrade data
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ console.warn('Load failed', e); }
  return migrate(seed());
}
// Upgrade any older data shape forward without discarding records.
function defaultDocs(){ return ['TB test','CPR certification','Fingerprints','Work agreement','W-2 / tax form','Criminal background check']
  .map(n=>({name:n,onFile:false,submitted:'',expires:'',note:''})); }
function defaultPhrases(){ return ['Ate full meal','Ate most of meal','Refused meal','Adequate fluid intake',
  'Slept through the night','Restless during the night','Pleasant and cooperative','Agitated this shift',
  'Participated in activities','Declined activities','Assisted with bathing and grooming',
  'Continent','Incontinent episode','No new concerns noted','Family visited today']; }
function migrate(db){
  if(!db || typeof db!=='object') db={};
  if(!Array.isArray(db.staff)) db.staff=[];
  if(!Array.isArray(db.residents)) db.residents=[];
  if(!db.schedule || typeof db.schedule!=='object') db.schedule={};
  Object.keys(db.schedule).forEach(k=>{ // keep only date-keyed 2-worker arrays; drop old weekday/AM-PM data
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) { delete db.schedule[k]; return; }
    if(!Array.isArray(db.schedule[k])) db.schedule[k]=['','']; });
  if(!db.recurring || typeof db.recurring!=='object') db.recurring={};
  for(let i=0;i<7;i++){ if(!Array.isArray(db.recurring[i])) db.recurring[i]=['','']; }
  db.staff.forEach(s=>{ if(!Array.isArray(s.docs)) s.docs=defaultDocs(); });
  if(!Array.isArray(db.notePhrases)) db.notePhrases=defaultPhrases();
  db.residents.forEach(r=>{
    r.meds=r.meds||[]; r.notes=r.notes||[]; r.vitals=r.vitals||[];
    r.appointments=r.appointments||[]; r.allergies=r.allergies||[]; r.diagnoses=r.diagnoses||[];
    if(typeof r.diet!=='string') r.diet='';
    r.meds.forEach(m=>{
      m.log=m.log||[]; if(!Array.isArray(m.times)) m.times=[]; if(typeof m.prn!=='boolean') m.prn=false;
      if(typeof m.discontinued!=='boolean') m.discontinued=false;
      m.log.forEach(l=>{ if(!l.id) l.id=uid(); if(!l.status) l.status='given'; });
    });
  });
  db.schemaVersion=SCHEMA;
  return db;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ console.warn('Save failed', e); alert('Storage is full — uploaded document files may be too large. Use smaller scans or remove old files.'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

      {id:uid(), name:'Jada',    initials:'JAD'},
      {id:uid(), name:'Cielito', initials:'CIE'},
      {id:uid(), name:'Rowena',  initials:'ROW'},
      {id:uid(), name:'Jonathan',initials:'JON'},
      {id:uid(), name:'Billy',   initials:'BIL'}
    ],
    residents:(()=>{
      const M=(name,dose,schedule,times,notes,prn)=>({id:uid(),name,dose:dose||'',route:'PO',
        schedule:schedule||'',times:times||[],prn:!!prn,discontinued:false,notes:notes||'',log:[]});

        ],
        Melanie:[
          M('Daily vitamin','','Once daily (morning)',['08:00']),
          M('Oyster shell calcium','','Once daily',['08:00']),

          M('Trazodone','','Frequency not specified — confirm label',[])
        ],

function current(){ return DB.residents.find(r=>r.id===currentId); }

/* ---------------- Login ---------------- */
function renderLogin(){
  const g = document.getElementById('staffGrid');
  const tiles = (DB.staff||[]).map(s=>{ const a=staffAlerts(s);
    return `<div class="staff-tile" onclick="login('${s.id}')">
      ${a?`<span class="tile-alert" title="${a} document(s) need attention">${a}</span>`:''}
      <span class="avatar">${esc(s.initials)}</span>
      <span class="nm">${esc(s.name)}</span>
    </div>`; }).join('');
  g.innerHTML = tiles + `
    <div class="staff-tile add" onclick="quickAddStaff()">
      <span class="plus">+</span><span class="nm">Add caregiver</span></div>`;
  const ls=DB.lastSigned, foot=document.getElementById('lastSignedFoot');
  if(foot) foot.innerHTML = ls ? `Last MAR signature — ${esc(ls.name)} — ${fmtDate(ls.when.slice(0,10))}` : '';
}
function login(id){
  me = DB.staff.find(s=>s.id===id); if(!me) return;
  initAudio();
  document.getElementById('login').style.display='none';
  document.getElementById('appWrap').style.display='block';
  document.getElementById('meAvatar').textContent = me.initials;
  document.getElementById('meName').textContent = me.name;
  updateMeDocAlert();
  let last=null; try{ last=localStorage.getItem('lh_lastResident'); }catch(e){}
  currentId = (last && DB.residents.some(r=>r.id===last))? last : (DB.residents[0]?.id||null);
  renderSidebar(); renderMain();
}
function updateMeDocAlert(){
  const el=document.getElementById('meDocAlert'); if(!el||!me)return;
  const n=staffAlerts(me);
  el.innerHTML = n? `<span class="badge-dot" title="${n} document(s) need attention" onclick="openAdmin('caregivers')">${n} ⚠</span>`:'';
}
function logout(){
  me=null;
  document.getElementById('appWrap').style.display='none';
  document.getElementById('login').style.display='grid';
  renderLogin();
}
function quickAddStaff(){
  const name = prompt('Caregiver full name:'); if(!name) return;
  let init = prompt('Initials (e.g. AB):','');
  init = (init||name.split(/\s+/).map(w=>w[0]).join('')).toUpperCase().slice(0,4);
  DB.staff.push({id:uid(), name:name.trim(), initials:init, docs:defaultDocs()}); save(); renderLogin();
}

/* ---------------- Staff management ---------------- */
function manageStaff(){ renderStaffMgr(); document.getElementById('staffDialog').showModal(); }
function renderStaffMgr(){
  const el=document.getElementById('staffMgrList');
  el.innerHTML = (DB.staff||[]).map(s=>`
    <div class="flex-between" style="margin-bottom:8px">
      <span><span class="init-badge">${esc(s.initials)}</span> &nbsp;${esc(s.name)}</span>
      <span>
        <button class="btn sm" onclick="editStaff('${s.id}')">Edit</button>
        <button class="btn sm danger" onclick="removeStaff('${s.id}')">Remove</button>

function addStaff(){
  const name=document.getElementById('s_name').value.trim();
  let init=document.getElementById('s_initials').value.trim().toUpperCase();
  if(!name){ alert('Enter a name'); return; }
  if(!init) init=name.split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,4);
  DB.staff.push({id:uid(), name, initials:init});
  document.getElementById('s_name').value=''; document.getElementById('s_initials').value='';
  save(); renderStaffMgr(); renderStaffMini();
}
function editStaff(id){
  const s=DB.staff.find(x=>x.id===id);
  const name=prompt('Name:',s.name); if(name===null)return;
  const init=prompt('Initials:',s.initials); if(init===null)return;
  s.name=name.trim(); s.initials=init.trim().toUpperCase().slice(0,4);
  if(me&&me.id===id){ document.getElementById('meAvatar').textContent=s.initials; document.getElementById('meName').textContent=s.name; }
  save(); renderAdmin();
}
function removeStaff(id){
  if(!confirm('Remove this caregiver? Records they already stamped stay intact.'))return;
  DB.staff=DB.staff.filter(x=>x.id!==id); save(); renderAdmin();
}
function renderStaffMini(){
  const el=document.getElementById('staffMini'); if(!el)return;
  el.innerHTML=(DB.staff||[]).map(s=>`<span class="tag">${esc(s.initials)} · ${esc(s.name)}</span>`).join('') || '<span class="muted" style="font-size:13px">None</span>';
}

/* Handwritten signature styling — deterministic per person */
const SIGFONTS=["'Caveat',cursive","'Dancing Script',cursive","'Satisfy',cursive","'Shadows Into Light',cursive","'Homemade Apple',cursive","'Sacramento',cursive"];
function hashStr(s){ let h=0; s=String(s); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function sigStyle(seed){ const f=SIGFONTS[hashStr(seed)%SIGFONTS.length]; const rot=(hashStr(seed+'~')%9)-4; return `font-family:${f};transform:rotate(${rot}deg);`; }
function sig(text,seed){ return `<span class="sig" style="${sigStyle(seed||text)}">${esc(text)}</span>`; }
function signatureKeyHTML(){
  const rows=(DB.staff||[]).map(s=>`<tr>
    <td><span class="ini" style="${sigStyle(s.initials)}">${esc(s.initials)}</span></td>
    <td>=</td>
    <td>${sig(s.name, s.initials)}</td>
    <td class="muted">${esc(s.name)}</td></tr>`).join('');
  return `<details class="ref sigkey"><summary>Signature key</summary><div class="ref-body">
    <p class="muted" style="font-size:13px;margin:0 0 10px">Initials in each dose cell correspond to the caregiver's signature below.</p>
    <table><thead><tr><th>Initials</th><th></th><th>Signature</th><th>Name</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function dayEntries(m,d){
  return (m.log||[]).filter(l=>{const x=new Date(l.when);
    return x.getFullYear()===marYear && x.getMonth()===marMonth && x.getDate()===d;})
    .sort((a,b)=>a.when.localeCompare(b.when));
}
function stampDay(medId,d){
  const r=current(); const m=r.meds.find(x=>x.id===medId); const now=new Date();
  const isToday=(marYear===now.getFullYear() && marMonth===now.getMonth() && d===now.getDate());
  const dt=isToday? now : new Date(marYear,marMonth,d,12,0);
  m.log=m.log||[]; m.log.push({id:uid(), when:dt.toISOString(), by:me.initials, byId:me.id, status:'given'});
  DB.lastSigned={by:me.initials, name:me.name, when:new Date().toISOString(), med:m.name, resident:r.name};
  save(); renderTab();
}
function unstamp(medId,entryId){
  const r=current(); const m=r.meds.find(x=>x.id===medId);
  if(!confirm('Remove this initial?'))return;
  m.log=(m.log||[]).filter(e=>e.id!==entryId); save(); renderTab();
}

  : st==='withheld'?'<span class="statusicon" title="Withheld">⏸ withheld</span>'
  : st==='discontinued'?'<span class="statusicon" title="Discontinued">✕ d/c</span>':''; }

/* --- Today's Med Pass --- */
function todaySlots(r){
  const out=[];
  (r.meds||[]).forEach(m=>{ if(m.prn||m.discontinued)return; (m.times||[]).forEach(t=>out.push({med:m,time:t})); });
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function slotEntry(m,time){
  const now=new Date();
  return (m.log||[]).find(l=>l.slot===time && new Date(l.when).toDateString()===now.toDateString());
}
function medPassStats(r){
  const now=new Date(), in4=new Date(now.getTime()+4*3600e3); let given=0,due=0,missed=0;
  (r.meds||[]).forEach(m=>(m.log||[]).forEach(l=>{
    if(new Date(l.when).toDateString()===now.toDateString() && (l.status||'given')==='given') given++; }));
  todaySlots(r).forEach(({med,time})=>{ if(slotEntry(med,time))return;
    const [h,mi]=time.split(':').map(Number); const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,mi);
    if(dt<now) missed++; else if(dt<=in4) due++; });
  return {given,due,missed};
}
function giveSlot(medId,time){ recordSlot(medId,time,'given',''); }
function recordSlot(medId,time,status,reason){
  const r=current(); const m=r.meds.find(x=>x.id===medId);
  m.log=m.log||[]; m.log.push({id:uid(),when:new Date().toISOString(),by:me.initials,byId:me.id,status,slot:time,reason:reason||''});
  DB.lastSigned={by:me.initials,name:me.name,when:new Date().toISOString(),med:m.name,resident:r.name};
  save(); renderTab();
}
function slotMenu(medId,time){
  genOpen('Record dose',[
    ['status','Status','refused',false,false,'select',[['given','Given'],['refused','Refused'],['withheld','Withheld']]],
    ['reason','Reason / note (optional)','']
  ], vals=>recordSlot(medId,time,vals.status,vals.reason));
}
function logPRN(medId){
  genOpen('Log PRN (as-needed) dose',[
    ['reason','Reason given (e.g. agitation, pain)','',true],
    ['note','Note (optional)','']
  ], vals=>{ const r=current(); const m=r.meds.find(x=>x.id===medId);
    m.log=m.log||[]; m.log.push({id:uid(),when:new Date().toISOString(),by:me.initials,byId:me.id,status:'given',slot:'PRN',reason:vals.reason,note:vals.note});
    DB.lastSigned={by:me.initials,name:me.name,when:new Date().toISOString(),med:m.name,resident:r.name};
    save(); renderTab(); });
}
function unstampEntry(medId,entryId){
  const r=current(); const m=r.meds.find(x=>x.id===medId);
  m.log=(m.log||[]).filter(e=>e.id!==entryId); save(); renderTab();
}
function medPassHTML(r){
  const now=new Date(); const s=medPassStats(r);
  const chips=`<div class="statchips">
    <div class="statchip g"><div class="n">${s.given}</div><div class="l">Given today</div></div>
    <div class="statchip d"><div class="n">${s.due}</div><div class="l">Due next 4 hrs</div></div>
    <div class="statchip m"><div class="n">${s.missed}</div><div class="l">Missed today</div></div>
  </div>`;
  const slots=todaySlots(r);
  const rows=slots.length? slots.map(({med,time})=>{
    const e=slotEntry(med,time);
    const [h,mi]=time.split(':').map(Number); const past=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,mi)<now;
    let right;
    if(e){ const st=e.status||'given';
      const mark = st==='given'? sig(e.by) : `${statusIcon(st)} ${sig(e.by)}`;
      right=`<span class="slot-done">${mark}<a class="undo" onclick="unstampEntry('${med.id}','${e.id}')">undo</a></span>`;
    } else {
      right=`<span class="slot-actions"><button class="btn sm primary" onclick="giveSlot('${med.id}','${time}')">Give — ${esc(me.initials)}</button>
        <button class="btn sm" title="Refused / Withheld" onclick="slotMenu('${med.id}','${time}')">⋯</button></span>`;
    }
    return `<div class="slot ${!e&&past?'past':''}"><span class="slot-time">${fmtTime12(time)}</span>
      <span class="slot-med"><b>${esc(med.name)}</b> ${esc(med.dose||'')}<span class="slot-dir">${esc(med.schedule||'')}</span></span>
      ${right}</div>`;
  }).join('') : `<div class="empty">No scheduled medications for today.</div>`;
  const prnMeds=(r.meds||[]).filter(m=>m.prn && !m.discontinued);
  const prnToday=(r.meds||[]).flatMap(m=>(m.log||[]).filter(l=>l.slot==='PRN' && new Date(l.when).toDateString()===now.toDateString()).map(l=>({...l,med:m.name})))
    .sort((a,b)=>b.when.localeCompare(a.when));
  const prnList=prnMeds.length? prnMeds.map(m=>`<div class="slot"><span class="slot-med"><b>${esc(m.name)}</b> ${esc(m.dose||'')}<span class="slot-dir">${esc(m.schedule||'')}${m.notes?' · '+esc(m.notes):''}</span></span>
      <span class="slot-actions"><button class="btn sm primary" onclick="logPRN('${m.id}')">Log PRN — ${esc(me.initials)}</button></span></div>`).join('') : '';
  const prnGiven=prnToday.length? `<div class="section-h">PRN given today</div>`+prnToday.map(l=>`<div class="slot">
      <span class="slot-time">${new Date(l.when).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</span>
      <span class="slot-med"><b>${esc(l.med)}</b><span class="slot-dir">${esc(l.reason||'')}</span></span>
      <span class="slot-done">${sig(l.by)}<a class="undo" onclick="unstampEntry('${(r.meds.find(m=>m.name===l.med)||{}).id}','${l.id}')">undo</a></span></div>`).join('') : '';
  return `${chips}
    <div class="section-h">Scheduled — ${now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>
    ${rows}
    ${prnMeds.length?`<div class="section-h">As needed (PRN)</div>${prnList}`:''}
    ${prnGiven}`;
}
/* --- Monthly grid (audit view) --- */
function monthGridHTML(r){
  const now=new Date();
  const daysInMonth=new Date(marYear,marMonth+1,0).getDate();
  const isCurMonth=(marYear===now.getFullYear() && marMonth===now.getMonth());
  const todayNum=now.getDate();
  const monthOpts=MONTHS.map((n,i)=>`<option value="${i}" ${i===marMonth?'selected':''}>${n}</option>`).join('');
  let headCells='';
  for(let d=1; d<=daysInMonth; d++){ headCells+=`<th class="${(isCurMonth&&d===todayNum)?'today':''}">${d}</th>`; }
  const rows=(r.meds||[]).map(m=>{

      <span class="muted" style="font-size:12px">Tap a day cell to sign. Tap an entry to undo.</span>
    </div>

      <tbody>${rows || `<tr><td class="medcol">No medications</td><td class="empty" colspan="${daysInMonth}">Add a medication to begin.</td></tr>`}</tbody>
    </table></div>
    ${legendHTML()}

}
function entriesForDate(m,y,mo,d){ return (m.log||[]).filter(l=>{const x=new Date(l.when);
  return x.getFullYear()===y&&x.getMonth()===mo&&x.getDate()===d;}).sort((a,b)=>a.when.localeCompare(b.when)); }
function stampDate(medId,key){

}
function cellInner(m,es){ return es.map(e=>{ const st=e.status||'given';

}).join(' '); }
function medColCell(m){ return `<td class="medcol">

function weekGridHTML(r){

function sameDay(when,y,mo,d){ const x=new Date(when); return x.getFullYear()===y&&x.getMonth()===mo&&x.getDate()===d; }
function entriesOn(m,dt){ return (m.log||[]).filter(l=>sameDay(l.when,dt.getFullYear(),dt.getMonth(),dt.getDate()) && l.slot!=='PRN')
    .sort((a,b)=>a.when.localeCompare(b.when)); }
function cellMarks(entries){

    if(st==='given') return `<span class="print-sig">${esc(e.by)}</span>`;
    const t=st==='refused'?'R':st==='withheld'?'W':'DC';
    return `<span title="${esc(st)}">${t} ${esc(e.by)}</span>`; }).join('<br>');
}
function printHeader(r,label){

function printGrid(r,dates,title){
  const head=dates.map(d=>`<th>${d.getMonth()+1}/${d.getDate()}</th>`).join('');
  const rows=(r.meds||[]).map(m=>{
    const cells=dates.map(d=>`<td>${cellMarks(entriesOn(m,d))}</td>`).join('');

function printDay(r,base){
  const slots=[]; (r.meds||[]).forEach(m=>{ if(m.prn||m.discontinued)return; (m.times||[]).forEach(t=>slots.push({m,t})); });
  slots.sort((a,b)=>a.t.localeCompare(b.t));
  const rows=slots.map(({m,t})=>{
    const e=(m.log||[]).find(l=>l.slot===t && sameDay(l.when,base.getFullYear(),base.getMonth(),base.getDate()));
    const mark=e? (e.status==='given'?`<span class="print-sig">${esc(e.by)}</span>`:`${esc(e.status)} — ${esc(e.by)}`):'—';
    return `<tr><td class="l">${fmtTime12(t)}</td><td class="l"><b>${esc(m.name)}</b> ${esc(m.dose||'')}</td><td>${mark}</td></tr>`;
  }).join('') || '<tr><td colspan="3">No scheduled medications.</td></tr>';
  const prn=(r.meds||[]).flatMap(m=>(m.log||[]).filter(l=>l.slot==='PRN'&&sameDay(l.when,base.getFullYear(),base.getMonth(),base.getDate())).map(l=>({...l,med:m.name})))
    .sort((a,b)=>a.when.localeCompare(b.when));
  const prnRows=prn.map(l=>`<tr><td class="l">${new Date(l.when).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</td><td class="l"><b>${esc(l.med)}</b> — ${esc(l.reason||'')}</td><td><span class="print-sig">${esc(l.by)}</span></td></tr>`).join('');
  return `<div class="section-h">Med pass — ${base.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
    <table class="ptable"><thead><tr><th class="l">Time</th><th class="l">Medication</th><th>Given by</th></tr></thead><tbody>${rows}</tbody></table>
    ${prn.length?`<div class="section-h">PRN (as-needed) given</div><table class="ptable"><thead><tr><th class="l">Time</th><th class="l">Medication / reason</th><th>By</th></tr></thead><tbody>${prnRows}</tbody></table>`:''}`;
}
function printSigKey(){
  return `<div class="section-h">Signature key</div><table class="ptable" style="max-width:560px"><thead><tr><th class="l" style="width:80px">Initials</th><th class="l">Signature</th><th class="l">Full name</th></tr></thead><tbody>${(DB.staff||[]).map(s=>`<tr><td class="l"><b>${esc(s.initials)}</b></td><td class="l"><span class="print-sig">${esc(s.name)}</span></td><td class="l">${esc(s.name)}</td></tr>`).join('')}</tbody></table>`;
}
function printSheet(r,range,base){
  let body,label;
  if(range==='month'){ const y=base.getFullYear(),mo=base.getMonth(),N=new Date(y,mo+1,0).getDate();
    const dates=[]; for(let i=1;i<=N;i++)dates.push(new Date(y,mo,i)); label=MONTHS[mo]+' '+y; body=printGrid(r,dates,'Monthly MAR — '+label);
  } else if(range==='week'){ const start=new Date(base); start.setDate(base.getDate()-base.getDay());
    const dates=[]; for(let i=0;i<7;i++){const d=new Date(start); d.setDate(start.getDate()+i); dates.push(d);}
    label='Week of '+start.toLocaleDateString(); body=printGrid(r,dates,'Weekly MAR — '+label);
  } else { label=base.toLocaleDateString(); body=printDay(r,base); }
  return `<div class="print-sheet">${printHeader(r,label)}${body}</div>`;
}
function buildPrintView(range,dateStr,all){

function downloadPrint(){

    +`<link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet"><style>${css}</style></head><body>${pv.innerHTML}</body></html>`;

function saveResident(e){
  const d=document.getElementById('residentDialog'); const id=d.dataset.id;
  const g=f=>document.getElementById(f).value.trim();
  const data={ name:g('r_name'), dob:g('r_dob'), room:g('r_room'), physician:g('r_physician'),
    contact:g('r_contact'), phone:g('r_phone'), insurance:g('r_insurance'),

  genOpen(m?'Edit medication':'Add medication',[
    ['name','Medication name',m?.name||'',true],
    ['dose','Dose (e.g. 500 mg)',m?.dose||''],

  ], vals=>{
    const data={name:vals.name,dose:vals.dose,route:vals.route,schedule:vals.schedule,
      times:parseTimes(vals.times),prn:vals.prn,discontinued:vals.discontinued,notes:vals.notes};
    if(m){Object.assign(m,data);} else {r.meds=r.meds||[];r.meds.push({id:uid(),...data,log:[]});}
    save(); renderTab();
  });
}
function parseTimes(str){
  if(!str) return [];
  return str.split(',').map(s=>s.trim()).filter(Boolean).map(t=>{
    let m=t.match(/^(\d{1,2}):(\d{2})\s*([ap]\.?m\.?)?$/i);
    if(m){ let hr=+m[1]; if(m[3]){ hr=hr%12; if(/p/i.test(m[3]))hr+=12; } return String(hr).padStart(2,'0')+':'+m[2]; }
    let h=t.match(/^(\d{1,2})\s*([ap]\.?m\.?)$/i);
    if(h){ let hr=+h[1]%12; if(/p/i.test(h[2]))hr+=12; return String(hr).padStart(2,'0')+':00'; }
    return null;
  }).filter(Boolean).sort();
}
function fmtTime12(hhmm){ const p=String(hhmm).split(':'); let h=+p[0]; const mn=p[1]||'00';
  const ap=h<12?'AM':'PM'; h=h%12; if(h===0)h=12; return `${h}:${mn} ${ap}`; }

/* ---------------- Schedule & auto-fill ---------------- */
function mondayOfWeek(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
let schedStart=mondayOfWeek(new Date());
function shiftSched(days){ schedStart=new Date(schedStart); schedStart.setDate(schedStart.getDate()+days); renderAdmin(); }
const WDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function staffOptions(sel){ return `<option value="">— none —</option>`+(DB.staff||[]).map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${esc(s.name)}</option>`).join(''); }
function setRecurring(day,slot,id){ if(!Array.isArray(DB.recurring[day]))DB.recurring[day]=['','']; DB.recurring[day][slot]=id; save(); renderAdmin(); }
function setDaySched(key,slot,staffId){ if(!Array.isArray(DB.schedule[key])) DB.schedule[key]=['','']; DB.schedule[key][slot]=staffId; save(); renderAdmin(); }
function clearDayOverride(key){ delete DB.schedule[key]; save(); renderAdmin(); }
// Effective workers for a date = explicit override if that date was set, else the recurring weekly default.
function effectiveSched(dt){ const key=keyOf(dt);
  if(Object.prototype.hasOwnProperty.call(DB.schedule,key)) return DB.schedule[key];
  const rec=DB.recurring[dt.getDay()]; return Array.isArray(rec)? rec.slice() : ['','']; }
function workersOn(dt){ return effectiveSched(dt).map(id=>DB.staff.find(s=>s.id===id)).filter(Boolean); }
function missingDosesOn(dt,residents){ let c=0;
  residents.forEach(r=>(r.meds||[]).forEach(m=>{ if(m.prn||m.discontinued)return;
    (m.times||[]).forEach(t=>{ if(!(m.log||[]).some(l=>l.slot===t && sameDay(l.when,dt.getFullYear(),dt.getMonth(),dt.getDate()))) c++; }); }));
  return c; }
function adminAuto(){
  const recRows=WDAYS.map((n,i)=>{ const c=DB.recurring[i]||['',''];
    return `<div class="sched-row"><span class="day" style="min-width:110px">${n}</span>
      <select onchange="setRecurring(${i},0,this.value)" style="max-width:150px">${staffOptions(c[0])}</select>
      <select onchange="setRecurring(${i},1,this.value)" style="max-width:150px">${staffOptions(c[1])}</select></div>`; }).join('');
  const todayKey=keyOf(new Date()); let rows='';
  for(let i=0;i<14;i++){ const dt=new Date(schedStart); dt.setDate(schedStart.getDate()+i); const key=keyOf(dt);
    const cur=effectiveSched(dt);
    const overridden=Object.prototype.hasOwnProperty.call(DB.schedule,key);
    rows+=`<div class="sched-row"><span class="day" style="min-width:170px">${dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}${key===todayKey?' •':''}${overridden?' <span class="muted" style="font-weight:600;font-size:11px">(custom)</span>':''}</span>
      <select onchange="setDaySched('${key}',0,this.value)" style="max-width:150px">${staffOptions(cur[0])}</select>
      <select onchange="setDaySched('${key}',1,this.value)" style="max-width:150px">${staffOptions(cur[1])}</select>
      ${overridden?`<a class="muted" style="cursor:pointer;font-size:12px;font-weight:700" onclick="clearDayOverride('${key}')">reset</a>`:''}</div>`;
    if(i===6) rows+='<div style="height:1px;background:var(--line);margin:6px 0"></div>';
  }
  const end=new Date(schedStart); end.setDate(schedStart.getDate()+13);
  const range=schedStart.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+end.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  return `<div class="note-box">When <b>two</b> caregivers work a day, that day's doses are <b>split between them, alternating</b> — the first dose goes to Caregiver 1, the next to Caregiver 2, and so on. Auto-fill finds days where the MAR wasn't finished, tells you who was scheduled, then fills the missing scheduled doses. It never fills PRN or vitals. A signature means that caregiver gave the dose — review before treating it as the official record.</div>
    <div class="cg-card"><h3 style="margin:0 0 4px">Lock-in weekly schedule</h3>
      <p class="muted" style="margin:0 0 12px;font-size:13px">Set who usually works each weekday (e.g. Rowena every Tue/Wed/Thu). These apply to every week automatically — you only change the exceptions below.</p>
      <div style="display:flex;gap:8px;color:var(--muted);font-size:12px;font-weight:700;margin:0 0 8px 118px"><span style="min-width:150px">Caregiver 1</span><span>Caregiver 2</span></div>
      ${recRows}</div>
    <div class="cg-card"><div class="flex-between" style="margin-bottom:10px">
        <h3 style="margin:0">This 2 weeks — exceptions</h3>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn sm" onclick="shiftSched(-14)">◀ Prev</button>
          <b style="font-size:14px">${range}</b>
          <button class="btn sm" onclick="shiftSched(14)">Next ▶</button></div></div>
      <p class="muted" style="margin:-4px 0 10px;font-size:13px">Pre-filled from the weekly schedule above. Change any day to override just that date; "reset" returns it to the weekly default.</p>
      <div style="display:flex;gap:8px;color:var(--muted);font-size:12px;font-weight:700;margin:0 0 8px 178px"><span style="min-width:150px">Caregiver 1</span><span>Caregiver 2</span></div>
      ${rows}</div>
    <div class="cg-card"><h3 style="margin:0 0 10px">Fill in incomplete MAR days</h3>
      <p class="muted" style="margin:0 0 12px;font-size:14px">Checks the 2 weeks above (up to today) and reports which days need filling before making changes.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" onclick="autoFill(false)">Check &amp; fill — current resident</button>
        <button class="btn" onclick="autoFill(true)">Check &amp; fill — all residents</button>
        <button class="btn danger" onclick="clearAutoFill(true)">Clear auto-filled entries</button>
      </div></div>`;
}
function autoFill(all){
  const residents=all? DB.residents : [current()];
  const now=new Date(); const plan=[];
  for(let i=0;i<14;i++){ const dt=new Date(schedStart); dt.setDate(schedStart.getDate()+i);
    if(dt.toDateString()!==now.toDateString() && dt>now) continue;   // don't fill future days
    const workers=workersOn(dt); if(!workers.length) continue;
    const count=missingDosesOn(dt,residents); if(count>0) plan.push({dt,workers,count});
  }
  if(!plan.length){ alert('No incomplete scheduled doses found in this 2-week block.\n\nCheck that: (1) the medications have Scheduled times set (Edit each med), and (2) the days have caregivers assigned above.'); return; }
  const msg='The MAR was not completed on these days, but caregivers were scheduled:\n\n'
    + plan.map(p=>`• ${p.dt.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})} — ${p.workers.map(w=>w.name).join(' & ')} — ${p.count} dose${p.count>1?'s':''}`).join('\n')
    + '\n\nFill these in with the working caregivers’ initials?';
  if(!confirm(msg)) return;
  let added=0;
  plan.forEach(p=>{ let k=0; residents.forEach(r=>(r.meds||[]).forEach(m=>{ if(m.prn||m.discontinued)return;
    (m.times||[]).forEach(t=>{ if((m.log||[]).some(l=>l.slot===t && sameDay(l.when,p.dt.getFullYear(),p.dt.getMonth(),p.dt.getDate())))return;
      const st=p.workers[k%p.workers.length]; k++; const [h,mi]=t.split(':').map(Number);
      m.log.push({id:uid(),when:new Date(p.dt.getFullYear(),p.dt.getMonth(),p.dt.getDate(),h,mi).toISOString(),by:st.initials,byId:st.id,status:'given',slot:t,auto:true}); added++;
    }); })); });
  save(); renderAdmin(); alert(added+' dose(s) filled in across '+plan.length+' day(s).');
}
function clearAutoFill(all){
  const residents=all? DB.residents:[current()]; let n=0;
  residents.forEach(r=>(r.meds||[]).forEach(m=>{ const b=(m.log||[]).length; m.log=(m.log||[]).filter(l=>!l.auto); n+=b-m.log.length; }));
  save(); renderAdmin(); alert(n+' auto-filled entry(ies) removed.');
}

  return `<div class="cg-card"><h3 style="margin:0 0 8px">Backup &amp; restore</h3>

/* ---------------- Reminder beeps ---------------- */
let audioCtx=null;
function initAudio(){ try{ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC)audioCtx=new AC(); }
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(n){ if(!audioCtx)return; let t=audioCtx.currentTime;
  for(let i=0;i<(n||3);i++){ const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880; o.type='sine'; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.35); o.start(t); o.stop(t+0.36); t+=0.5; } }
function pendingDosesNow(){ const now=new Date(); let n=0;
  DB.residents.forEach(r=>(r.meds||[]).forEach(m=>{ if(m.prn||m.discontinued)return; (m.times||[]).forEach(t=>{
    const [h,mi]=t.split(':').map(Number); if(new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,mi)<=now
      && !(m.log||[]).some(l=>l.slot===t && sameDay(l.when,now.getFullYear(),now.getMonth(),now.getDate()))) n++;
  }); }));
  return n;
}
const CHECKPOINTS=[9,12,17];
function reminderTick(){
  if(!me) return; const now=new Date(), hr=now.getHours();
  if(!CHECKPOINTS.includes(hr) || now.getMinutes()>5) return;
  const key='lh_alert_'+now.toDateString()+'_'+hr;
  try{ if(localStorage.getItem(key)) return; localStorage.setItem(key,'1'); }catch(e){}
  const n=pendingDosesNow(); if(n>0){ beep(3); showReminderBanner(n,hr); }
}
function showReminderBanner(n,hr){
  let b=document.getElementById('reminderBanner');
  if(!b){ b=document.createElement('div'); b.id='reminderBanner'; document.body.appendChild(b); }
  b.className='reminder-banner';
  const ap=hr>=12?'pm':'am', h12=hr>12?hr-12:hr;
  b.innerHTML=`🔔 <span><b>${h12}${ap} medication check —</b> ${n} scheduled dose${n>1?'s':''} not yet recorded.</span>
    <button class="btn sm primary" onclick="this.parentNode.remove()">OK</button>`;
}
setInterval(reminderTick, 30000);

/* ---------------- Backup / restore ---------------- */
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='little-heaven-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importData(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
    if(!d.residents) throw new Error('Not a valid backup');
    if(!confirm('This will replace all current data with the backup. Continue?'))return;
    DB=migrate(d); save(); logout();
  }catch(err){ alert('Could not read backup: '+err.message); } };
  rd.readAsText(f); ev.target.value='';
}

/* ---------------- Helpers ---------------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initialsOf(n){ return (n||'?').replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?'; }
function splitList(s){ return s? s.split(',').map(x=>x.trim()).filter(Boolean):[]; }
function age(dob){ if(!dob)return '—'; const d=new Date(dob); if(isNaN(d))return '—';
  const t=new Date(); let a=t.getFullYear()-d.getFullYear();
  if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--; return a; }
function fmtDate(s){ if(!s)return '—'; const d=new Date(s+'T00:00:00'); if(isNaN(d))return esc(s);
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(s){ if(!s)return '—'; const d=new Date(s); if(isNaN(d))return esc(s);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }

/* ---------------- Init ---------------- */
save();                                        // persist migrated data under the stable key
try{ LEGACY.forEach(k=>localStorage.removeItem(k)); }catch(e){}  // retire old versioned keys
renderLogin();
</script>
